name: Host and VPS training

on:
  push:
    branches:
      - codex/vps-persistent-compute
  pull_request:
    branches:
      - main
      - codex/vps-persistent-compute
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked Node dependencies
        run: npm ci
      - name: Install kernel and actual CPU training dependencies
        run: |
          python -m pip install jupyter_client==8.10.0 ipykernel==7.4.0 numpy==2.5.3
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate code and production dependencies
        run: |
          npm run lint
          npm audit --omit=dev
          npm run compile
      - name: Run complete host and VPS integration suite without skips
        run: node node_modules/mocha/bin/mocha.js --timeout 20000 --forbid-pending --exit 'out/test/**/*.test.js'
      - name: Check kernel and detached process lifecycle
        run: |
          python -W error::ResourceWarning test/jupyter_bridge_unit.py -q
          python -W error::ResourceWarning test/vps_agent_audit.py -q
          python -W error::ResourceWarning test/anti_fraud_reference_test.py -q
          python -W error::ResourceWarning test/persistent_reference_integration_test.py -q
      - name: Package the verified extension and agent sources
        run: |
          node scripts/make-artifacts.mjs --preflight-only
          node node_modules/@vscode/vsce/vsce package --no-yarn --no-dependencies --no-rewrite-relative-links --allow-missing-repository
          node scripts/make-artifacts.mjs
      - name: Save installable extension and full source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pair-notebook-training-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            pair-notebook-*.vsix
            pair-notebook-complete-*.zip
