name: Apply line-scoped projection quarantine

on:
  push:
    branches:
      - codex/line-scoped-quarantine

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/line-scoped-quarantine
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Apply narrow production patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/vscode/sync.ts')
          text = path.read_text(encoding='utf-8')

          replacements = []

          replacements.append((
          '''interface ProjectionQuarantine {
            readonly document: vscode.TextDocument;
            readonly target: string;
            readonly renderId: number;
            readonly expiresAt: number;
            readonly timer: NodeJS.Timeout;
          }''',
          '''interface ProjectionQuarantine {
            readonly document: vscode.TextDocument;
            readonly target: string;
            readonly renderId: number;
            readonly expiresAt: number;
            readonly timer: NodeJS.Timeout;
            startLine: number;
            endLine: number;
          }'''))

          replacements.append((
          '''      const edit = minimalEdit(current, target);
                const workspaceEdit = new vscode.WorkspaceEdit();''',
          '''      const edit = minimalEdit(current, target);
                // Keep the post-projection guard line-scoped. The unchanged prefix
                // before a minimal edit has identical line numbering in current/target,
                // while inserted newlines define every resulting line touched by it.
                const quarantineStartLine = document.positionAt(edit.offset).line;
                const quarantineEndLine = quarantineStartLine + (edit.insertText.match(/\\n/g)?.length ?? 0);
                const workspaceEdit = new vscode.WorkspaceEdit();'''))

          replacements.append((
          '''          this.armProjectionQuarantine(document, target, pending.id);''',
          '''          this.armProjectionQuarantine(
                    document,
                    target,
                    pending.id,
                    quarantineStartLine,
                    quarantineEndLine,
                  );'''))

          replacements.append((
          '''  private armProjectionQuarantine(document: vscode.TextDocument, target: string, renderId: number): void {
              const uri = document.uri.toString();
              this.clearProjectionQuarantine(uri);
              const expiresAt = Date.now() + REMOTE_TEXT_QUARANTINE_MS;
              const timer = setTimeout(() => {
                const current = this.projectionQuarantines.get(uri);
                if (current?.renderId === renderId) this.projectionQuarantines.delete(uri);
              }, REMOTE_TEXT_QUARANTINE_MS);
              timer.unref?.();
              this.projectionQuarantines.set(uri, { document, target, renderId, expiresAt, timer });
            }''',
          '''  private armProjectionQuarantine(
              document: vscode.TextDocument,
              target: string,
              renderId: number,
              startLine: number,
              endLine: number,
            ): void {
              const uri = document.uri.toString();
              this.clearProjectionQuarantine(uri);
              const expiresAt = Date.now() + REMOTE_TEXT_QUARANTINE_MS;
              const timer = setTimeout(() => {
                const current = this.projectionQuarantines.get(uri);
                if (current?.renderId === renderId) this.projectionQuarantines.delete(uri);
              }, REMOTE_TEXT_QUARANTINE_MS);
              timer.unref?.();
              this.projectionQuarantines.set(uri, {
                document,
                target,
                renderId,
                expiresAt,
                timer,
                startLine,
                endLine: Math.max(startLine, endLine),
              });
            }'''))

          replacements.append((
          '''  private suppressProjectionTail(event: vscode.TextDocumentChangeEvent): boolean {
              const uri = event.document.uri.toString();
              const quarantine = this.projectionQuarantines.get(uri);
              if (!quarantine || quarantine.document !== event.document) return false;
              if (Date.now() >= quarantine.expiresAt) {
                this.clearProjectionQuarantine(uri);
                return false;
              }
              this.log.appendLine(
                `[debug] Suppressed delayed editor transition during remote text render ${quarantine.renderId} `
                + `for ${event.document.uri.fsPath}; target=${textDigest(this.currentCanonicalText(event.document, quarantine.target))} `
                + `result=${textDigest(event.document.getText())}.`,
              );
              // Canonical state may have advanced after this quarantine was armed. Always
              // restore the latest authority value so an older render cannot overwrite a
              // newer accepted operation while its delayed editor tail is being removed.
              void this.applyText(event.document, this.currentCanonicalText(event.document, quarantine.target)).catch((error) => {
                this.log.appendLine(`[error] Could not restore a delayed projection tail: ${formatError(error)}`);
              });
              return true;
            }''',
          '''  private suppressProjectionTail(event: vscode.TextDocumentChangeEvent): boolean {
              const uri = event.document.uri.toString();
              const quarantine = this.projectionQuarantines.get(uri);
              if (!quarantine || quarantine.document !== event.document) return false;
              if (Date.now() >= quarantine.expiresAt) {
                this.clearProjectionQuarantine(uri);
                return false;
              }

              // VS Code does not expose edit authorship, so keep the existing
              // conservative suppression for the exact line span touched by the
              // remote projection. Independent lines remain local-first even while
              // the 100 ms tail guard is armed.
              const overlapsProjectionLines = event.contentChanges.some((change) =>
                change.range.start.line <= quarantine.endLine
                && change.range.end.line >= quarantine.startLine);
              if (!overlapsProjectionLines) {
                // A genuine edit above the protected span can add/remove newlines.
                // Rebase the span so a later delayed projection tail is still
                // matched to the same logical lines rather than an adjacent line.
                let lineShift = 0;
                for (const change of event.contentChanges) {
                  if (change.range.end.line >= quarantine.startLine) continue;
                  const insertedLines = change.text.split('\\n').length - 1;
                  const removedLines = change.range.end.line - change.range.start.line;
                  lineShift += insertedLines - removedLines;
                }
                if (lineShift !== 0) {
                  quarantine.startLine = Math.max(0, quarantine.startLine + lineShift);
                  quarantine.endLine = Math.max(quarantine.startLine, quarantine.endLine + lineShift);
                }
                return false;
              }

              this.log.appendLine(
                `[debug] Suppressed delayed editor transition during remote text render ${quarantine.renderId} `
                + `for ${event.document.uri.fsPath} on protected lines ${quarantine.startLine + 1}-${quarantine.endLine + 1}; `
                + `target=${textDigest(this.currentCanonicalText(event.document, quarantine.target))} `
                + `result=${textDigest(event.document.getText())}.`,
              );
              // Canonical state may have advanced after this quarantine was armed. Always
              // restore the latest authority value so an older render cannot overwrite a
              // newer accepted operation while its delayed editor tail is being removed.
              void this.applyText(event.document, this.currentCanonicalText(event.document, quarantine.target)).catch((error) => {
                this.log.appendLine(`[error] Could not restore a delayed projection tail: ${formatError(error)}`);
              });
              return true;
            }'''))

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Expected production snippet was not found; refusing a partial patch:\n' + old[:180])
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Install locked dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run existing unit and integration tests
        run: npm test

      - name: Commit only the production fix
        shell: bash
        run: |
          git rm .github/workflows/apply-line-scoped-quarantine.yml
          git add src/vscode/sync.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sync): scope projection quarantine to remote lines"
          git push origin HEAD:codex/line-scoped-quarantine
