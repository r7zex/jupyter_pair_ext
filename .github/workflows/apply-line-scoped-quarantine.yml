name: Apply line-scoped projection quarantine

on:
  push:
    branches:
      - codex/line-scoped-quarantine

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/line-scoped-quarantine
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Apply narrow production patch and E2E regressions
        shell: python
        run: |
          from pathlib import Path

          sync = Path('src/vscode/sync.ts')
          text = sync.read_text(encoding='utf-8')

          replacements = [
          ('''interface ProjectionQuarantine {
            readonly document: vscode.TextDocument;
            readonly target: string;
            readonly renderId: number;
            readonly expiresAt: number;
            readonly timer: NodeJS.Timeout;
          }''', '''interface ProjectionQuarantine {
            readonly document: vscode.TextDocument;
            readonly target: string;
            readonly renderId: number;
            readonly expiresAt: number;
            readonly timer: NodeJS.Timeout;
            startLine: number;
            endLine: number;
          }'''),
          ('''      const edit = minimalEdit(current, target);
                const workspaceEdit = new vscode.WorkspaceEdit();''', '''      const edit = minimalEdit(current, target);
                // Scope the short post-projection guard to the lines actually
                // touched by this minimal remote edit. Same-line ambiguity stays
                // conservative; independent lines remain fully local-first.
                const quarantineStartLine = document.positionAt(edit.offset).line;
                const quarantineEndLine = quarantineStartLine + countLineBreaks(edit.insertText);
                const workspaceEdit = new vscode.WorkspaceEdit();'''),
          ('''          this.armProjectionQuarantine(document, target, pending.id);''', '''          this.armProjectionQuarantine(
                    document,
                    target,
                    pending.id,
                    quarantineStartLine,
                    quarantineEndLine,
                  );'''),
          ('''    if (!key || !event.contentChanges.length || this.capturePendingTextEvent(event)
                || this.suppressProjectionTail(event)) return;''', '''    if (!key || !event.contentChanges.length || this.capturePendingTextEvent(event)
                || this.suppressProjectionTail(event, baseline)) return;'''),
          ('''      if (!event.contentChanges.length || this.capturePendingTextEvent(event)
                  || this.suppressProjectionTail(event)) return;''', '''      if (!event.contentChanges.length || this.capturePendingTextEvent(event)
                  || this.suppressProjectionTail(event, baseline)) return;'''),
          ('''  private armProjectionQuarantine(document: vscode.TextDocument, target: string, renderId: number): void {
              const uri = document.uri.toString();
              this.clearProjectionQuarantine(uri);
              const expiresAt = Date.now() + REMOTE_TEXT_QUARANTINE_MS;
              const timer = setTimeout(() => {
                const current = this.projectionQuarantines.get(uri);
                if (current?.renderId === renderId) this.projectionQuarantines.delete(uri);
              }, REMOTE_TEXT_QUARANTINE_MS);
              timer.unref?.();
              this.projectionQuarantines.set(uri, { document, target, renderId, expiresAt, timer });
            }''', '''  private armProjectionQuarantine(
              document: vscode.TextDocument,
              target: string,
              renderId: number,
              startLine: number,
              endLine: number,
            ): void {
              const uri = document.uri.toString();
              this.clearProjectionQuarantine(uri);
              const expiresAt = Date.now() + REMOTE_TEXT_QUARANTINE_MS;
              const timer = setTimeout(() => {
                const current = this.projectionQuarantines.get(uri);
                if (current?.renderId === renderId) this.projectionQuarantines.delete(uri);
              }, REMOTE_TEXT_QUARANTINE_MS);
              timer.unref?.();
              this.projectionQuarantines.set(uri, {
                document,
                target,
                renderId,
                expiresAt,
                timer,
                startLine,
                endLine: Math.max(startLine, endLine),
              });
            }'''),
          ('''  private suppressProjectionTail(event: vscode.TextDocumentChangeEvent): boolean {
              const uri = event.document.uri.toString();
              const quarantine = this.projectionQuarantines.get(uri);
              if (!quarantine || quarantine.document !== event.document) return false;
              if (Date.now() >= quarantine.expiresAt) {
                this.clearProjectionQuarantine(uri);
                return false;
              }
              this.log.appendLine(
                `[debug] Suppressed delayed editor transition during remote text render ${quarantine.renderId} `
                + `for ${event.document.uri.fsPath}; target=${textDigest(this.currentCanonicalText(event.document, quarantine.target))} `
                + `result=${textDigest(event.document.getText())}.`,
              );
              // Canonical state may have advanced after this quarantine was armed. Always
              // restore the latest authority value so an older render cannot overwrite a
              // newer accepted operation while its delayed editor tail is being removed.
              void this.applyText(event.document, this.currentCanonicalText(event.document, quarantine.target)).catch((error) => {
                this.log.appendLine(`[error] Could not restore a delayed projection tail: ${formatError(error)}`);
              });
              return true;
            }''', '''  private suppressProjectionTail(event: vscode.TextDocumentChangeEvent, baseline?: string): boolean {
              const uri = event.document.uri.toString();
              const quarantine = this.projectionQuarantines.get(uri);
              if (!quarantine || quarantine.document !== event.document) return false;
              if (Date.now() >= quarantine.expiresAt) {
                this.clearProjectionQuarantine(uri);
                return false;
              }

              // TextDocumentContentChangeEvent offsets refer to the pre-change
              // document. Use that immutable baseline rather than change.range so
              // this stays correct for real VS Code and the existing boundary mocks.
              // If a baseline is unavailable, retain the old whole-document safety
              // behavior rather than risk turning an editor projection tail into a
              // fresh CRDT operation.
              const lineChanges = baseline === undefined ? undefined : event.contentChanges.map((change) => ({
                startLine: textLineAtOffset(baseline, change.rangeOffset),
                endLine: textLineAtOffset(baseline, change.rangeOffset + change.rangeLength),
                insertedLines: countLineBreaks(change.text),
              }));
              const overlapsProjectionLines = lineChanges === undefined
                || lineChanges.some((change) => change.startLine <= quarantine.endLine
                  && change.endLine >= quarantine.startLine);
              if (!overlapsProjectionLines) {
                // Independent local edits are accepted immediately. If they add
                // or remove complete lines above the remote span, move the guard
                // with the same logical text so a later projection tail remains
                // protected instead of drifting onto an adjacent local line.
                let lineShift = 0;
                for (const change of lineChanges) {
                  if (change.endLine >= quarantine.startLine) continue;
                  lineShift += change.insertedLines - (change.endLine - change.startLine);
                }
                if (lineShift !== 0) {
                  quarantine.startLine = Math.max(0, quarantine.startLine + lineShift);
                  quarantine.endLine = Math.max(quarantine.startLine, quarantine.endLine + lineShift);
                }
                return false;
              }

              this.log.appendLine(
                `[debug] Suppressed delayed editor transition during remote text render ${quarantine.renderId} `
                + `for ${event.document.uri.fsPath} on protected lines ${quarantine.startLine + 1}-${quarantine.endLine + 1}; `
                + `target=${textDigest(this.currentCanonicalText(event.document, quarantine.target))} `
                + `result=${textDigest(event.document.getText())}.`,
              );
              // Same-line ambiguity deliberately keeps the proven conservative
              // behavior that prevents duplicate characters/newlines.
              void this.applyText(event.document, this.currentCanonicalText(event.document, quarantine.target)).catch((error) => {
                this.log.appendLine(`[error] Could not restore a delayed projection tail: ${formatError(error)}`);
              });
              return true;
            }''')]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Expected production snippet was not found; refusing partial patch:\n' + old[:220])
              text = text.replace(old, new, 1)

          helper_anchor = '''function textDigest(value: string): string {'''
          helper = '''function countLineBreaks(value: string): number {
            let count = 0;
            for (let index = 0; index < value.length; index += 1) {
              if (value.charCodeAt(index) === 10) count += 1;
            }
            return count;
          }

          function textLineAtOffset(value: string, offset: number): number {
            const end = Math.max(0, Math.min(value.length, offset));
            let line = 0;
            for (let index = 0; index < end; index += 1) {
              if (value.charCodeAt(index) === 10) line += 1;
            }
            return line;
          }

          '''
          if helper_anchor not in text:
              raise SystemExit('textDigest helper anchor not found')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)
          sync.write_text(text, encoding='utf-8')

          # Real file-backed VS Code regression: remote line 1 must not quarantine line 2.
          extension_test = Path('test/e2e/extensionHost.e2e.ts')
          ext = extension_test.read_text(encoding='utf-8')
          anchor = '''  test('authors genuine local typing after the projection-tail quarantine has expired', async () => {'''
          new_test = '''  test('keeps immediate local typing on a different line during projection quarantine', async () => {
            const harness = await createTextHarness('remote = 0\\nlocal = 0');
            try {
              harness.project.applyTextChanges(
                harness.key,
                [{ offset: 9, deleteCount: 1, insertText: '1' }],
                REMOTE_ORIGIN,
              );
              await waitFor(() => harness.document.getText() === 'remote = 1\\nlocal = 0', 3_000, 'remote first-line projection');
              assert.equal(
                (harness.synchronizer as any).projectionQuarantines.has(harness.document.uri.toString()),
                true,
                'the local edit must be exercised while the 100 ms guard is still armed',
              );

              const localLineEnd = harness.document.lineAt(1).range.end;
              const edit = new vscode.WorkspaceEdit();
              edit.insert(harness.document.uri, localLineEnd, ' + 1');
              assert.equal(await vscode.workspace.applyEdit(edit), true);
              await waitFor(
                () => harness.project.text(harness.key).toString() === 'remote = 1\\nlocal = 0 + 1',
                3_000,
                'different-line local edit to remain authored during quarantine',
              );
              assert.equal(harness.document.getText(), 'remote = 1\\nlocal = 0 + 1');
            } finally {
              await harness.dispose();
            }
          });

          ''' + anchor
          if anchor not in ext:
              raise SystemExit('extension E2E insertion anchor not found')
          ext = ext.replace(anchor, new_test, 1)
          extension_test.write_text(ext, encoding='utf-8')

          # Real .ipynb regression: same cell, different line, still local-first.
          notebook_test = Path('test/e2e/notebookHost.e2e.ts')
          nb = notebook_test.read_text(encoding='utf-8')
          nb_anchor = '''  test('publishes a real local NotebookEdit insertion with a new stable cell identity', async function () {'''
          nb_new = '''  test('keeps immediate local typing on another line of the same cell during projection quarantine', async () => {
            const harness = await createNotebookHarness('remote = 0\\nlocal = 0');
            try {
              const cell = harness.notebook.cellAt(0);
              const stableId = harness.project.notebookSnapshot(harness.key).cells[0]?.id;
              assert.ok(stableId);
              harness.project.applyCellTextChanges(
                harness.key,
                stableId,
                [{ offset: 9, deleteCount: 1, insertText: '1' }],
                REMOTE_ORIGIN,
              );
              await waitFor(() => cell.document.getText() === 'remote = 1\\nlocal = 0', 3_000, 'remote first-line cell projection');
              assert.equal(
                (harness.synchronizer as any).projectionQuarantines.has(cell.document.uri.toString()),
                true,
                'the cell edit must occur inside the 100 ms guard',
              );

              const edit = new vscode.WorkspaceEdit();
              edit.insert(cell.document.uri, cell.document.lineAt(1).range.end, ' + 1');
              assert.equal(await vscode.workspace.applyEdit(edit), true);
              await waitFor(
                () => harness.project.cellSource(harness.key, stableId).toString() === 'remote = 1\\nlocal = 0 + 1',
                3_000,
                'different-line cell edit to remain authored during quarantine',
              );
              assert.equal(cell.document.getText(), 'remote = 1\\nlocal = 0 + 1');
            } finally {
              await harness.dispose();
            }
          });

          ''' + nb_anchor
          if nb_anchor not in nb:
              raise SystemExit('notebook E2E insertion anchor not found')
          nb = nb.replace(nb_anchor, nb_new, 1)
          notebook_test.write_text(nb, encoding='utf-8')

      - name: Install locked dependencies
        run: npm ci

      - name: Install real-kernel test dependencies
        run: python -m pip install jupyter_client==8.6.3 ipykernel==6.29.5

      - name: Compile
        run: npm run compile

      - name: Run complete existing test suite
        run: npm test

      - name: Install isolated VS Code E2E driver
        run: npm install --prefix .e2e-driver --no-save --package-lock=false @vscode/test-electron@3.1.0

      - name: Focus E2E on editor and notebook boundaries
        shell: python
        run: |
          from pathlib import Path
          path = Path('test/e2e/suite/index.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace("  mocha.addFile(path.resolve(__dirname, '..', 'controllerHost.e2e.js'));\n", '')
          path.write_text(text, encoding='utf-8')

      - name: Run real VS Code 1.95 Extension Host E2E
        env:
          PAIR_NOTEBOOK_E2E_DRIVER: test-electron
          PAIR_NOTEBOOK_E2E_TEST_ELECTRON_PATH: .e2e-driver/node_modules/@vscode/test-electron/out/index.js
          PAIR_NOTEBOOK_E2E_VSCODE_VERSION: 1.95.0
          PAIR_NOTEBOOK_E2E_TIMEOUT_MS: '240000'
        run: xvfb-run -a npm run test:e2e

      - name: Restore normal E2E suite and commit validated fix
        shell: bash
        run: |
          git checkout -- test/e2e/suite/index.ts
          git rm .github/workflows/apply-line-scoped-quarantine.yml
          git add src/vscode/sync.ts test/e2e/extensionHost.e2e.ts test/e2e/notebookHost.e2e.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sync): scope projection quarantine to remote lines"
          git push origin HEAD:codex/line-scoped-quarantine
