name: Apply line-scoped projection quarantine v2

on:
  push:
    branches: [codex/line-scoped-quarantine]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/line-scoped-quarantine
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Apply line-scoped guard and regressions
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/vscode/sync.ts')
          s = p.read_text(encoding='utf-8')
          def once(old, new):
              global s
              if old not in s:
                  raise SystemExit('missing expected sync snippet: ' + old[:120])
              s = s.replace(old, new, 1)

          once('''interface ProjectionQuarantine {
            readonly document: vscode.TextDocument;
            readonly target: string;
            readonly renderId: number;
            readonly expiresAt: number;
            readonly timer: NodeJS.Timeout;
          }''', '''interface ProjectionQuarantine {
            readonly document: vscode.TextDocument;
            readonly target: string;
            readonly renderId: number;
            readonly expiresAt: number;
            readonly timer: NodeJS.Timeout;
            startLine: number;
            endLine: number;
          }''')

          once('''      const edit = minimalEdit(current, target);
                const workspaceEdit = new vscode.WorkspaceEdit();''', '''      const edit = minimalEdit(current, target);
                // Same-line ambiguity remains conservative, while unrelated lines
                // stay local-first during the short post-projection guard.
                const quarantineStartLine = textLineAtOffset(current, edit.offset);
                const quarantineEndLine = quarantineStartLine + countLineBreaks(edit.insertText);
                const workspaceEdit = new vscode.WorkspaceEdit();''')

          once('''          this.armProjectionQuarantine(document, target, pending.id);''', '''          this.armProjectionQuarantine(
                    document, target, pending.id, quarantineStartLine, quarantineEndLine,
                  );''')

          once('''    if (!key || !event.contentChanges.length || this.capturePendingTextEvent(event)
                || this.suppressProjectionTail(event)) return;''', '''    if (!key || !event.contentChanges.length || this.capturePendingTextEvent(event)
                || this.suppressProjectionTail(event, baseline)) return;''')
          once('''      if (!event.contentChanges.length || this.capturePendingTextEvent(event)
                  || this.suppressProjectionTail(event)) return;''', '''      if (!event.contentChanges.length || this.capturePendingTextEvent(event)
                  || this.suppressProjectionTail(event, baseline)) return;''')

          old_arm = '''  private armProjectionQuarantine(document: vscode.TextDocument, target: string, renderId: number): void {
              const uri = document.uri.toString();
              this.clearProjectionQuarantine(uri);
              const expiresAt = Date.now() + REMOTE_TEXT_QUARANTINE_MS;
              const timer = setTimeout(() => {
                const current = this.projectionQuarantines.get(uri);
                if (current?.renderId === renderId) this.projectionQuarantines.delete(uri);
              }, REMOTE_TEXT_QUARANTINE_MS);
              timer.unref?.();
              this.projectionQuarantines.set(uri, { document, target, renderId, expiresAt, timer });
            }'''
          new_arm = '''  private armProjectionQuarantine(
              document: vscode.TextDocument,
              target: string,
              renderId: number,
              startLine: number,
              endLine: number,
            ): void {
              const uri = document.uri.toString();
              this.clearProjectionQuarantine(uri);
              const expiresAt = Date.now() + REMOTE_TEXT_QUARANTINE_MS;
              const timer = setTimeout(() => {
                const current = this.projectionQuarantines.get(uri);
                if (current?.renderId === renderId) this.projectionQuarantines.delete(uri);
              }, REMOTE_TEXT_QUARANTINE_MS);
              timer.unref?.();
              this.projectionQuarantines.set(uri, {
                document, target, renderId, expiresAt, timer, startLine,
                endLine: Math.max(startLine, endLine),
              });
            }'''
          once(old_arm, new_arm)

          old_suppress = '''  private suppressProjectionTail(event: vscode.TextDocumentChangeEvent): boolean {
              const uri = event.document.uri.toString();
              const quarantine = this.projectionQuarantines.get(uri);
              if (!quarantine || quarantine.document !== event.document) return false;
              if (Date.now() >= quarantine.expiresAt) {
                this.clearProjectionQuarantine(uri);
                return false;
              }
              this.log.appendLine(
                `[debug] Suppressed delayed editor transition during remote text render ${quarantine.renderId} `
                + `for ${event.document.uri.fsPath}; target=${textDigest(this.currentCanonicalText(event.document, quarantine.target))} `
                + `result=${textDigest(event.document.getText())}.`,
              );
              // Canonical state may have advanced after this quarantine was armed. Always
              // restore the latest authority value so an older render cannot overwrite a
              // newer accepted operation while its delayed editor tail is being removed.
              void this.applyText(event.document, this.currentCanonicalText(event.document, quarantine.target)).catch((error) => {
                this.log.appendLine(`[error] Could not restore a delayed projection tail: ${formatError(error)}`);
              });
              return true;
            }'''
          new_suppress = '''  private suppressProjectionTail(event: vscode.TextDocumentChangeEvent, baseline?: string): boolean {
              const uri = event.document.uri.toString();
              const quarantine = this.projectionQuarantines.get(uri);
              if (!quarantine || quarantine.document !== event.document) return false;
              if (Date.now() >= quarantine.expiresAt) {
                this.clearProjectionQuarantine(uri);
                return false;
              }

              // rangeOffset/rangeLength are defined against the pre-change text.
              // This works in real VS Code and in the existing boundary mocks.
              // Missing baseline falls back to the old whole-document guard.
              const lines = baseline === undefined ? undefined : event.contentChanges.map((change) => ({
                start: textLineAtOffset(baseline, change.rangeOffset),
                end: textLineAtOffset(baseline, change.rangeOffset + change.rangeLength),
                inserted: countLineBreaks(change.text),
              }));
              const overlaps = lines === undefined || lines.some((change) =>
                change.start <= quarantine.endLine && change.end >= quarantine.startLine);
              if (!overlaps) {
                let shift = 0;
                for (const change of lines) {
                  if (change.end >= quarantine.startLine) continue;
                  shift += change.inserted - (change.end - change.start);
                }
                if (shift) {
                  quarantine.startLine = Math.max(0, quarantine.startLine + shift);
                  quarantine.endLine = Math.max(quarantine.startLine, quarantine.endLine + shift);
                }
                return false;
              }

              this.log.appendLine(
                `[debug] Suppressed delayed editor transition during remote text render ${quarantine.renderId} `
                + `for ${event.document.uri.fsPath} on protected lines ${quarantine.startLine + 1}-${quarantine.endLine + 1}; `
                + `target=${textDigest(this.currentCanonicalText(event.document, quarantine.target))} `
                + `result=${textDigest(event.document.getText())}.`,
              );
              // Keep the existing same-line duplicate/newline protection unchanged.
              void this.applyText(event.document, this.currentCanonicalText(event.document, quarantine.target)).catch((error) => {
                this.log.appendLine(`[error] Could not restore a delayed projection tail: ${formatError(error)}`);
              });
              return true;
            }'''
          once(old_suppress, new_suppress)

          anchor = 'function textDigest(value: string): string {'
          helper = '''function countLineBreaks(value: string): number {
            let count = 0;
            for (let i = 0; i < value.length; i += 1) if (value.charCodeAt(i) === 10) count += 1;
            return count;
          }

          function textLineAtOffset(value: string, offset: number): number {
            const end = Math.max(0, Math.min(value.length, offset));
            let line = 0;
            for (let i = 0; i < end; i += 1) if (value.charCodeAt(i) === 10) line += 1;
            return line;
          }

          '''
          if anchor not in s: raise SystemExit('missing helper anchor')
          s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s, encoding='utf-8')

          # Add real VS Code file regression.
          p = Path('test/e2e/extensionHost.e2e.ts'); s = p.read_text(encoding='utf-8')
          anchor = "  test('authors genuine local typing after the projection-tail quarantine has expired', async () => {"
          test = '''  test('keeps immediate local typing on a different line during projection quarantine', async () => {
            const harness = await createTextHarness('remote = 0\\nlocal = 0');
            try {
              harness.project.applyTextChanges(harness.key, [{ offset: 9, deleteCount: 1, insertText: '1' }], REMOTE_ORIGIN);
              await waitFor(() => harness.document.getText() === 'remote = 1\\nlocal = 0', 3_000, 'remote first-line projection');
              assert.equal((harness.synchronizer as any).projectionQuarantines.has(harness.document.uri.toString()), true);
              const edit = new vscode.WorkspaceEdit();
              edit.insert(harness.document.uri, harness.document.lineAt(1).range.end, ' + 1');
              assert.equal(await vscode.workspace.applyEdit(edit), true);
              await waitFor(() => harness.project.text(harness.key).toString() === 'remote = 1\\nlocal = 0 + 1', 3_000,
                'different-line local edit during quarantine');
              assert.equal(harness.document.getText(), 'remote = 1\\nlocal = 0 + 1');
            } finally { await harness.dispose(); }
          });

          '''
          if anchor not in s: raise SystemExit('missing file E2E anchor')
          p.write_text(s.replace(anchor, test + anchor, 1), encoding='utf-8')

          # Add real VS Code same-cell/different-line regression.
          p = Path('test/e2e/notebookHost.e2e.ts'); s = p.read_text(encoding='utf-8')
          anchor = "  test('publishes a real local NotebookEdit insertion with a new stable cell identity', async function () {"
          test = '''  test('keeps immediate local typing on another line of the same cell during projection quarantine', async () => {
            const harness = await createNotebookHarness('remote = 0\\nlocal = 0');
            try {
              const cell = harness.notebook.cellAt(0);
              const stableId = harness.project.notebookSnapshot(harness.key).cells[0]?.id;
              assert.ok(stableId);
              harness.project.applyCellTextChanges(harness.key, stableId,
                [{ offset: 9, deleteCount: 1, insertText: '1' }], REMOTE_ORIGIN);
              await waitFor(() => cell.document.getText() === 'remote = 1\\nlocal = 0', 3_000, 'remote first-line cell projection');
              assert.equal((harness.synchronizer as any).projectionQuarantines.has(cell.document.uri.toString()), true);
              const edit = new vscode.WorkspaceEdit();
              edit.insert(cell.document.uri, cell.document.lineAt(1).range.end, ' + 1');
              assert.equal(await vscode.workspace.applyEdit(edit), true);
              await waitFor(() => harness.project.cellSource(harness.key, stableId).toString() === 'remote = 1\\nlocal = 0 + 1', 3_000,
                'different-line cell edit during quarantine');
              assert.equal(cell.document.getText(), 'remote = 1\\nlocal = 0 + 1');
            } finally { await harness.dispose(); }
          });

          '''
          if anchor not in s: raise SystemExit('missing notebook E2E anchor')
          p.write_text(s.replace(anchor, test + anchor, 1), encoding='utf-8')

      - run: npm ci
      - run: python -m pip install jupyter_client==8.6.3 ipykernel==6.29.5
      - name: Compile
        run: npm run compile
      - name: Full unit/integration suite
        run: npm test
      - name: Install isolated E2E driver
        run: npm install --prefix .e2e-driver --no-save --package-lock=false @vscode/test-electron@3.1.0
      - name: Exclude unrelated controller E2E from focused validation
        shell: python
        run: |
          from pathlib import Path
          p = Path('test/e2e/suite/index.ts'); s = p.read_text(encoding='utf-8')
          p.write_text(s.replace("  mocha.addFile(path.resolve(__dirname, '..', 'controllerHost.e2e.js'));\n", ''), encoding='utf-8')
      - name: Real VS Code 1.95 editor/notebook E2E
        env:
          PAIR_NOTEBOOK_E2E_DRIVER: test-electron
          PAIR_NOTEBOOK_E2E_TEST_ELECTRON_PATH: .e2e-driver/node_modules/@vscode/test-electron/out/index.js
          PAIR_NOTEBOOK_E2E_VSCODE_VERSION: 1.95.0
          PAIR_NOTEBOOK_E2E_TIMEOUT_MS: '240000'
        run: xvfb-run -a npm run test:e2e
      - name: Commit validated fix only
        shell: bash
        run: |
          git checkout -- test/e2e/suite/index.ts
          git rm .github/workflows/apply-line-scoped-quarantine-v2.yml
          git add src/vscode/sync.ts test/e2e/extensionHost.e2e.ts test/e2e/notebookHost.e2e.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sync): scope projection quarantine to remote lines"
          git push origin HEAD:codex/line-scoped-quarantine
